<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeMind - 企业智能知识库</title>

    <style>
        :root {
            --bg-primary: #f0f4fc;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255,255,255,0.85);
            --text-primary: #0a1929;
            --text-secondary: #4a5c72;
            --text-tertiary: #8899aa;
            --accent: #1a6bff;
            --accent-light: #e8f0fe;
            --accent-dark: #0a4dcf;
            --accent-gradient: linear-gradient(135deg, #1a6bff, #0a4dcf);
            --green: #0fbf6f;
            --green-light: #e6f7ed;
            --amber: #f5a623;
            --amber-light: #fff8e6;
            --red: #e84855;
            --red-light: #fde8ea;
            --border: rgba(0,0,0,0.06);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --font-cn: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --font-en: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'SF Pro Display', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: var(--font-cn);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            max-width: 960px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            background: var(--bg-primary);
        }

        .sidebar {
            width: var(--sidebar-width);
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 18px 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 14px;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-cn);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 8px rgba(26,107,255,0.25);
            letter-spacing: 0.2px;
            position: relative;
            overflow: hidden;
        }

        .new-chat-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .new-chat-btn:hover { transform: translateY(-1px) scale(1.01); box-shadow: 0 4px 16px rgba(26,107,255,0.35); }
        .new-chat-btn:hover::after { opacity: 1; }
        .new-chat-btn:active { transform: translateY(0) scale(0.98); }

        .sidebar-section-label {
            padding: 0 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-search {
            margin: 0 10px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            font-size: 12px;
            font-family: var(--font-cn);
            color: var(--text-primary);
            outline: none;
            outline: none;
            transition: all 0.2s;
        }

        .sidebar-search::placeholder { color: var(--text-tertiary); font-size: 11px; }
        .sidebar-search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(26,107,255,0.06);
            background: #fff;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 16px;
        }

        .sidebar-list::-webkit-scrollbar { width: 4px; }
        .sidebar-list::-webkit-scrollbar-track { background: transparent; }
        .sidebar-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.06); border-radius: 2px; }
        .sidebar-list::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.12); }

        .conv-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 1px;
            transition: all 0.15s;
            position: relative;
        }

        .conv-item:hover { background: rgba(0,0,0,0.03); transform: translateX(2px); }
        .conv-item.active {
            background: var(--accent-light);
        }
        .conv-item.active::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: var(--accent);
            border-radius: 0 3px 3px 0;
        }

        .conv-icon {
            color: var(--text-tertiary);
            margin-top: 2px;
            flex-shrink: 0;
            font-size: 13px;
            width: 18px;
            text-align: center;
        }
        .conv-item.active .conv-icon { color: var(--accent); }

        .conv-info { flex: 1; min-width: 0; }

        .conv-preview {
            font-size: 13px;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        .conv-item.active .conv-preview { color: var(--accent); font-weight: 600; }

        .conv-meta {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 3px;
        }

        .conv-del {
            color: var(--text-tertiary);
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.15s;
            margin-top: -1px;
        }

        .conv-item:hover .conv-del { opacity: 1; }
        .conv-del:hover { background: var(--red-light); color: var(--red); }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== Header ===== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            background: var(--accent-gradient);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            font-weight: 700;
            font-family: var(--font-en);
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            font-family: var(--font-en);
            letter-spacing: -0.3px;
        }

        .header-title span {
            color: var(--accent);
        }

        .header-sub {
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stats-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--accent-light);
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
        }

        .stats-badge .dot {
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .upload-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-cn);
            transition: all 0.25s;
            box-shadow: 0 2px 8px rgba(26,107,255,0.3);
        }

        .upload-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26,107,255,0.4);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        /* ===== Messages ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }
        .messages::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

        /* ===== Welcome ===== */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            animation: fade-up 0.6s ease-out;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-light);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }

        .welcome-icon:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .welcome h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .welcome p {
            font-size: 14px;
            color: var(--text-tertiary);
            margin-bottom: 28px;
            max-width: 400px;
            line-height: 1.6;
        }

        .welcome-tips {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .welcome-tip {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 18px 22px;
            border-radius: var(--radius-md);
            min-width: 150px;
            transition: all 0.3s;
            cursor: default;
        }

        .welcome-tip:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: rgba(26,107,255,0.15);
        }

        .welcome-tip .icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .welcome-tip .label {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            font-weight: 500;
        }

        /* ===== Message ===== */
        .message {
            display: flex;
            gap: 12px;
            animation: msg-in 0.35s ease-out;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            font-size: 12px;
            font-family: var(--font-en);
        }

        .message.user .msg-avatar { background: var(--accent-gradient); }
        .message.assistant .msg-avatar { background: linear-gradient(135deg, #0fbf6f, #089981); }
        .message.system .msg-avatar { background: linear-gradient(135deg, #f5a623, #e8962e); }

        .msg-bubble {
            padding: 12px 18px;
            border-radius: var(--radius-md);
            max-width: 72%;
            word-break: break-word;
            line-height: 1.7;
            font-size: 14px;
            position: relative;
        }

        .message.user .msg-bubble {
            background: var(--accent-gradient);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .msg-bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            border-bottom-left-radius: 4px;
        }

        .message.system .msg-bubble {
            background: var(--amber-light);
            color: #8a6d0b;
            border: 1px solid rgba(245,166,35,0.2);
            border-radius: var(--radius-sm);
            font-size: 13px;
        }

        /* ===== Citations ===== */
        .citations-wrap {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .citation-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .citation-tag:hover {
            background: #d0e2ff;
            transform: translateY(-1px);
        }

        .confidence-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        .confidence-tag.high { background: var(--green-light); color: var(--green); }
        .confidence-tag.medium { background: var(--amber-light); color: var(--amber); }
        .confidence-tag.low { background: var(--red-light); color: var(--red); }

        /* ===== Loading ===== */
        .loading-bubble {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--text-tertiary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        .loading-text {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        /* ===== Input Area ===== */
        .input-area-wrap {
            flex-shrink: 0;
            padding: 16px 28px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px 8px 8px 16px;
            transition: all 0.25s;
        }

        .input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(26,107,255,0.08);
            background: var(--bg-secondary);
        }

        .input-container textarea {
            flex: 1;
            border: none;
            background: transparent;
            padding: 6px 0;
            resize: none;
            outline: none;
            font-size: 14px;
            font-family: var(--font-cn);
            color: var(--text-primary);
            line-height: 1.6;
            max-height: 140px;
        }

        .input-container textarea::placeholder {
            color: var(--text-tertiary);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent-gradient);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(26,107,255,0.25);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26,107,255,0.35);
        }

        .send-btn:disabled {
            background: #d0d5dd;
            cursor: not-allowed;
            box-shadow: none;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 4px;
        }

        .input-footer .hint {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .input-footer .hint kbd {
            padding: 1px 5px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 10px;
            font-family: var(--font-en);
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }

        .toast {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            animation: toast-in 0.35s ease-out;
            box-shadow: var(--shadow-md);
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast.success { background: rgba(15,191,111,0.95); color: #fff; }
        .toast.error { background: rgba(232,72,85,0.95); color: #fff; }
        .toast.info { background: rgba(26,107,255,0.95); color: #fff; }

        /* ===== Drag Overlay ===== */
        .drop-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26,107,255,0.06);
            backdrop-filter: blur(4px);
            border: 3px dashed var(--accent);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
        }

        .drop-overlay.show { display: flex; animation: fade-in 0.2s; }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .drop-overlay .drop-icon {
            font-size: 48px;
        }

        .drop-overlay .drop-text {
            font-size: 18px;
            color: var(--accent);
            font-weight: 600;
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .header { padding: 0 16px; height: 56px; }
            .header-title { font-size: 15px; }
            .header-sub { display: none; }
            .stats-badge { display: none; }
            .upload-btn { padding: 6px 14px; font-size: 12px; }
            .messages { padding: 16px; }
            .msg-bubble { max-width: 85%; font-size: 13px; }
            .input-area-wrap { padding: 12px 16px 16px; }
            .welcome-tip { min-width: 120px; padding: 14px 16px; }
            .welcome h2 { font-size: 18px; }
        }

        @media (max-width: 480px) {
            .msg-bubble { max-width: 92%; }
            .welcome-tips { flex-direction: column; align-items: center; }
            .welcome-tip { width: 100%; max-width: 240px; }
        }
    </style>
</head>
<body>
    <div class="drop-overlay" id="dropOverlay">
        <div class="drop-icon">📄</div>
        <div class="drop-text">释放文件以上传到知识库</div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="app-layout">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">✚ 新对话</button>
                <input class="sidebar-search" id="convSearch" type="text" placeholder="搜索对话..." autocomplete="off">
            </div>
            <div class="sidebar-section-label">对话历史</div>
            <div class="sidebar-list" id="conversationList">
                <div style="text-align:center;padding:40px 0;color:var(--text-tertiary);font-size:13px;" id="convLoading">加载中...</div>
            </div>
        </div>

        <!-- Main -->
        <div class="main-area">
            <!-- Header -->
            <header class="header">
            <div class="header-brand">
                <div class="header-logo">K</div>
                <div>
                    <div class="header-title">Knowledge<span>Mind</span></div>
                    <div class="header-sub">Enterprise Intelligence</div>
                </div>
            </div>
            <div class="header-actions">
                <span class="stats-badge" id="chunkStats">
                    <span class="dot"></span>
                    -- 个知识片段
                </span>
                <button class="upload-btn" id="uploadBtn">
                    <span>↑</span> 上传文档
                </button>
                <input type="file" id="fileInput" hidden multiple
                    accept=".pdf,.txt,.md,.docx,.xlsx,.csv,.pptx,.jpg,.jpeg,.png,.bmp,.gif"
                    onchange="handleFileSelect(this.files)" />
            </div>
        </header>

        <!-- Messages -->
        <div class="messages" id="messages">
            <div class="welcome" id="welcomeMsg">
                <div class="welcome-icon">🧠</div>
                <h2>欢迎使用 KnowledgeMind</h2>
                <p>上传企业文档，即可开始智能问答。<br>系统支持 PDF、Word、Excel、PPT、TXT 和图片格式。</p>
                <div class="welcome-tips">
                    <div class="welcome-tip">
                        <div class="icon">📄</div>
                        <div class="label">上传文档<br>多格式解析</div>
                    </div>
                    <div class="welcome-tip">
                        <div class="icon">🔍</div>
                        <div class="label">混合检索<br>向量 + 关键词</div>
                    </div>
                    <div class="welcome-tip">
                        <div class="icon">💬</div>
                        <div class="label">精准回答<br>引用可追溯</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area-wrap">
            <div class="input-container">
                <textarea id="input" placeholder="输入你的问题，例如：公司有哪些规章制度？" rows="1"></textarea>
                <button class="send-btn" id="sendBtn" title="发送">↑</button>
            </div>
            <div class="input-footer">
                <span class="hint">支持 PDF · Word · Excel · PPT · 图片</span>
                <span class="hint"><kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行</span>
            </div>
        </div>
    </div>
</div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtnEl = document.getElementById('sendBtn');
        const chunkStatsEl = document.getElementById('chunkStats');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const dropOverlay = document.getElementById('dropOverlay');
        const toastContainer = document.getElementById('toastContainer');

        let isLoading = false;
        let currentConvId = null;
        let allConversations = [];

        // ===== Conversation Management =====
        const conversationListEl = document.getElementById('conversationList');
        const convLoading = document.getElementById('convLoading');
        const convSearch = document.getElementById('convSearch');

        function formatConvDate(ts) {
            const d = new Date(ts * 1000);
            const now = new Date();
            const diff = now - d;
            if (diff < 86400000 && now.getDate() === d.getDate()) {
                return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else if (diff < 172800000) {
                return '昨天 ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
            return d.toLocaleDateString('zh-CN');
        }

        function renderConversations(conversations) {
            if (!conversationListEl) return;

            if (!conversations || conversations.length === 0) {
                conversationListEl.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-tertiary);font-size:13px;line-height:1.8;">📭 暂无匹配的对话</div>';
                return;
            }

            conversationListEl.innerHTML = '';
            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conv-item' + (currentConvId === conv.conversation_id ? ' active' : '');
                item.innerHTML = `
                    <span class="conv-icon">💬</span>
                    <div class="conv-info">
                        <div class="conv-preview">${conv.preview || '新对话'}</div>
                        <div class="conv-meta">${formatConvDate(conv.last_updated)} · ${conv.turn_count} 轮</div>
                    </div>
                    <button class="conv-del" title="删除对话">✕</button>
                `;
                item.querySelector('.conv-del').addEventListener('click', async e => {
                    e.stopPropagation();
                    if (!confirm('确定删除此对话？')) return;
                    try {
                        item.style.opacity = '0.3';
                        await fetch(`/api/v1/conversations/${conv.conversation_id}`, { method: 'DELETE' });
                        showToast('对话已删除', 'info');
                        if (currentConvId === conv.conversation_id) startNewConversation();
                        loadConversations();
                    } catch { showToast('删除失败', 'error'); }
                });
                item.addEventListener('click', () => loadConversation(conv.conversation_id));
                conversationListEl.appendChild(item);
            });
        }

        async function loadConversations() {
            if (convLoading) convLoading.textContent = '加载中...';
            try {
                const res = await fetch('/api/v1/conversations');
                if (!res.ok) throw new Error('Failed to load');
                const data = await res.json();
                allConversations = data.conversations || [];

                const keyword = (convSearch?.value || '').trim().toLowerCase();
                const filtered = keyword
                    ? allConversations.filter(c => (c.preview || '').toLowerCase().includes(keyword))
                    : allConversations;

                if (keyword && filtered.length === 0) {
                    conversationListEl.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-tertiary);font-size:13px;line-height:1.8;">🔍 未找到 "<span style="font-weight:600;">' + keyword + '</span>"<br>试试其他关键词</div>';
                } else {
                    renderConversations(filtered);
                }
            } catch {
                if (conversationListEl) {
                    conversationListEl.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-tertiary);font-size:13px;line-height:1.8;">⚠️ 加载对话失败<br><span style="font-size:11px;">请检查网络连接</span></div>';
                }
            }
        }

        if (convSearch) {
            let searchTimer;
            convSearch.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => loadConversations(), 150);
            });
        }

        async function loadConversation(convId) {
            try {
                const res = await fetch(`/api/v1/conversations/${convId}`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();

                if (welcomeMsg && welcomeMsg.parentNode) welcomeMsg.remove();
                messagesEl.innerHTML = '';
                currentConvId = convId;

                data.turns.forEach((turn, idx) => {
                    addMessage('user', turn.query);
                    addMessage('assistant', turn.answer);
                });

                loadConversations();
            } catch {
                showToast('加载对话失败', 'error');
            }
        }

        function startNewConversation() {
            messagesEl.innerHTML = '';
            currentConvId = null;
            if (welcomeMsg) {
                messagesEl.appendChild(welcomeMsg);
            } else {
                const w = document.createElement('div');
                w.className = 'welcome';
                w.id = 'welcomeMsg';
                w.innerHTML = `
                    <div class="welcome-icon">🧠</div>
                    <h2>欢迎使用 KnowledgeMind</h2>
                    <p>上传企业文档，即可开始智能问答。<br>系统支持 PDF、Word、Excel、PPT、TXT 和图片格式。</p>
                    <div class="welcome-tips">
                        <div class="welcome-tip"><div class="icon">📄</div><div class="label">上传文档<br>多格式解析</div></div>
                        <div class="welcome-tip"><div class="icon">🔍</div><div class="label">混合检索<br>向量 + 关键词</div></div>
                        <div class="welcome-tip"><div class="icon">💬</div><div class="label">精准回答<br>引用可追溯</div></div>
                    </div>
                `;
                messagesEl.appendChild(w);
            }
            document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
            if (convSearch) convSearch.value = '';
            loadConversations();
        }

        document.getElementById('newChatBtn').addEventListener('click', startNewConversation);

        // ===== Toast =====
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 3000);
        }

        // ===== Stats =====
        async function refreshStats() {
            try {
                const res = await fetch('/api/v1/stats');
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                chunkStatsEl.innerHTML = `<span class="dot"></span> ${data.total_chunks} 个知识片段`;
            } catch(e) {
                chunkStatsEl.innerHTML = `<span class="dot" style="background:var(--amber)"></span> 连接中...`;
            }
        }
        refreshStats();
        setInterval(refreshStats, 15000);
        loadConversations();

        // ===== Add Message =====
        function addMessage(role, content, extra = {}) {
            if (welcomeMsg && welcomeMsg.parentNode) welcomeMsg.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;

            let bubble = String(content).replace(/\n/g, '<br>');

            if (extra.citations && extra.citations.length > 0) {
                bubble += '<div class="citations-wrap">';
                extra.citations.slice(0, 5).forEach(c => {
                    const title = c.document_title || '文档';
                    const page = c.page_number ? ` p.${c.page_number}` : '';
                    bubble += `<span class="citation-tag" title="${(c.content || '').replace(/"/g, '&quot;')}">📎 ${title}${page}</span>`;
                });
                bubble += '</div>';
            }

            if (extra.confidence !== undefined) {
                const pct = Math.round(extra.confidence * 100);
                let cls = 'high';
                if (pct < 40) cls = 'low';
                else if (pct < 70) cls = 'medium';
                const label = pct >= 70 ? '高置信度' : (pct >= 40 ? '中置信度' : '低置信度');
                bubble += `<div class="confidence-tag ${cls}">${label} · ${pct}%</div>`;
            }

            const avatarMap = { user: 'U', assistant: 'K', system: '!' };
            div.innerHTML = `
                <div class="msg-avatar">${avatarMap[role] || '?'}</div>
                <div class="msg-bubble">${bubble}</div>
            `;

            messagesEl.appendChild(div);
            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }

        // ===== Upload =====
        async function uploadFile(file) {
            const maxSize = 50 * 1024 * 1024;
            if (file.size > maxSize) {
                showToast(`文件过大（最大 50MB）: ${file.name}`, 'error');
                return;
            }

            showToast(`正在上传 ${file.name}...`, 'info');

            const form = new FormData();
            form.append('file', file);

            try {
                const res = await fetch('/api/v1/upload', { method: 'POST', body: form });
                const data = await res.json();

                if (res.ok) {
                    showToast(`${file.name} 上传成功！解析为 ${data.chunks_count} 个知识片段`, 'success');
                    addMessage('system', `📄 <b>${file.name}</b> 已上传并解析为 <b>${data.chunks_count}</b> 个知识片段`);
                    refreshStats();
                } else {
                    const errMsg = data.detail || (typeof data === 'string' ? data : '上传失败');
                    showToast(`${file.name} 上传失败: ${errMsg}`, 'error');
                }
            } catch(e) {
                showToast(`${file.name} 上传失败: ${e.message}`, 'error');
            }
        }

        async function handleFileSelect(files) {
            for (const file of files) {
                await uploadFile(file);
            }
            document.getElementById('fileInput').value = '';
        }

        // ===== Drag & Drop =====
        let dragCounter = 0;

        document.addEventListener('dragenter', e => {
            e.preventDefault();
            dragCounter++;
            dropOverlay.classList.add('show');
        });

        document.addEventListener('dragleave', e => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                dropOverlay.classList.remove('show');
            }
        });

        document.addEventListener('dragover', e => e.preventDefault());

        document.addEventListener('drop', e => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.remove('show');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files);
            }
        });

        // ===== Paste Image =====
        document.addEventListener('paste', e => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    if (file) uploadFile(file);
                }
            }
        });

        // ===== Upload Button =====
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        // ===== Send =====
        async function sendQuery() {
            const query = inputEl.value.trim();
            if (!query || isLoading) return;

            isLoading = true;
            sendBtnEl.disabled = true;
            addMessage('user', query);
            inputEl.value = '';
            inputEl.style.height = 'auto';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = `
                <div class="msg-avatar">K</div>
                <div class="loading-bubble">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <span class="loading-text">正在检索知识库...</span>
                </div>
            `;
            messagesEl.appendChild(loadingDiv);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            try {
                const res = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, conversation_id: currentConvId, top_k: 5 })
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText);
                }

                const data = await res.json();
                loadingDiv.remove();

                currentConvId = data.conversation_id;

                addMessage('assistant', data.answer, {
                    citations: data.citations,
                    confidence: data.confidence_score
                });

                loadConversations();
            } catch(err) {
                loadingDiv.remove();
                addMessage('assistant', '抱歉，系统处理请求时出现异常。请确认：<br>1. 后端服务正在运行<br>2. 已配置有效的 DeepSeek API Key<br>3. 已上传文档到知识库<br><br><span style="font-size:12px;color:var(--text-tertiary)">错误: ' + (err.message || '未知错误') + '</span>');
            }

            isLoading = false;
            sendBtnEl.disabled = false;
            inputEl.focus();
        }

        sendBtnEl.addEventListener('click', sendQuery);

        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuery();
            }
        });

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        });

        inputEl.focus();
    </script>
</body>
</html>
